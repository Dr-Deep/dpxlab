name: go-test

on:
  push:
    branches: [ "prod", "devel" ]
  pull_request:
    branches: [ "prod", "devel" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6

    - name: Test
      run: go test -v .

    - name: Build
      run: go build -v .
