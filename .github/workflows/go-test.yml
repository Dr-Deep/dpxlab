name: go-test

on:
  push:
    branches: [ "prod", "devel" ]
  pull_request:
    branches: [ "prod", "devel" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Test
      run: go test -v .

    - name: Build
      run: go build -v -o dpxlab.elf .
