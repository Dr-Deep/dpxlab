name: go-lint

on:
  push:
    branches: [ "prod", "devel" ]
  pull_request:
    branches: [ "prod", "devel" ]

permissions:
  contents: read
  
jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - uses: golangci/golangci-lint-action@9
      with: version: "latest"
